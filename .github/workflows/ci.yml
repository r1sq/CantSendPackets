name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - run: make windows arm64 linux
      - name: Linux checks against a simulated network
        # Ubuntu blocks unprivileged user namespaces through AppArmor; the lab
        # needs them, and the runner is a throwaway VM.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          make netlab
      - name: Look for known vulnerabilities
        # Built for the runner; GOOS only selects what gets analysed.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" -tags desktop,production ./...
          GOOS=linux "$(go env GOPATH)/bin/govulncheck" ./cmd/... ./internal/...
