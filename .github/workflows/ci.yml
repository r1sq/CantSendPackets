name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - run: make windows arm64 linux
      - name: Linux window
        # Builds against the system's GTK and WebKitGTK, then starts it on a
        # virtual display: still running after 8 seconds means it came up.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
          CGO_ENABLED=1 go vet -tags desktop,production,webkit2_41 .
          make linux-gui
          status=0
          dbus-run-session -- xvfb-run -a timeout 8 build/CantSendPackets-linux-amd64 || status=$?
          test "$status" -eq 124
      - name: Linux checks against a simulated network
        # Ubuntu blocks unprivileged user namespaces through AppArmor; the lab
        # needs them, and the runner is a throwaway VM.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          make netlab
      - name: Look for known vulnerabilities
        # Built for the runner; GOOS only selects what gets analysed.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" -tags desktop,production ./...
          GOOS=linux "$(go env GOPATH)/bin/govulncheck" ./cmd/... ./internal/...
