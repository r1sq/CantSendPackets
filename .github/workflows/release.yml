name: Release

# Pushing a tag like v1.2.3 publishes a release. Every installed copy will offer it,
# so the signing job runs in the "release" environment: add required reviewers there
# (Settings > Environments) to make publishing take a second approval.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  # The Linux window needs cgo against the system's GTK and WebKitGTK, so it's built
  # natively per architecture, on the oldest Ubuntu supported: the result runs on
  # any distribution with at least that glibc. It gets no secrets; the release job
  # signs what it hands over.
  linux-gui:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing from an earlier run goes into a signed build
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: make release-linux-gui VERSION="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-gui-${{ matrix.runner }}
          path: build/linux-gui/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: linux-gui
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # to create the release, and nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # nothing from an earlier run goes into a signed build
      - run: make test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-gui-*
          path: build/linux-gui
          merge-multiple: true
      - name: Build and sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ github.ref_name }}
        run: make release VERSION="$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" build/release/* --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --verify-tag
